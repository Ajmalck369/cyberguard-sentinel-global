name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cyberguard_test
          POSTGRES_USER: cyberguard
          POSTGRES_PASSWORD: local_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyberguard -d cyberguard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://cyberguard:local_test_only@127.0.0.1:5432/cyberguard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgres://cyberguard:local_test_only@127.0.0.1:5432/cyberguard_test
      - run: npm test
